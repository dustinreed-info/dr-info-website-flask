server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /about -> /about/ -> /about/index.html, else custom 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long cache for fingerprintable static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
