name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main
      - feature/astro-s3-cloudfront # TODO: remove feature/astro-s3-cloudfront after merge to main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Playwright tests
        run: docker build --target test .

      - name: Build static site
        run: |
          docker build \
            --target export \
            --build-arg PUBLIC_LAMBDA_ENDPOINT="${{ secrets.PUBLIC_LAMBDA_ENDPOINT }}" \
            -o type=local,dest=./dist .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.AWS_BUCKET_NAME }} --delete

      - name: Set content types and cache headers
        run: |
          BUCKET=s3://${{ vars.AWS_BUCKET_NAME }}
          aws s3 cp "$BUCKET" "$BUCKET" --recursive --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" --metadata-directive REPLACE \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp "$BUCKET" "$BUCKET" --recursive --exclude "*" --include "*.css" \
            --content-type "text/css; charset=utf-8" --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$BUCKET" "$BUCKET" --recursive --exclude "*" --include "*.js" \
            --content-type "application/javascript; charset=utf-8" --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        if: success()
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
